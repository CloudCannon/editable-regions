# Fixture site for the Hugo editable-regions integration.
#
# Consumes the module exactly as a real site would — a module import of the
# repo root — with a local replacement so development uses the working tree.
baseURL = "/"
title = "Hugo Editable Regions Fixture"

[module]
  # Note: relative replacement targets resolve against themesDir
  # (test/integrations/hugo/themes), not the project dir — hence four levels.
  replacements = "github.com/CloudCannon/editable-regions -> ../../../.."
  [[module.imports]]
    path = "github.com/CloudCannon/editable-regions"

[params]
  brand = "Fixture Brand"

  [params.editable_regions]
    verbose = true

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
