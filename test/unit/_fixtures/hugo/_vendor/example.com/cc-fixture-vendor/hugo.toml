# Hand-written module config so the editor's dep capture exercises mounts:
# the default layouts tree plus relocated data and i18n sources.
[module]
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "vendordata"
    target = "data"
  [[module.mounts]]
    source = "vendori18n"
    target = "i18n"
  # A single-FILE mount (source is not a directory) — the shape bookshop uses
  # to expose its dispatchers (core/bookshop.html -> layouts/partials/bookshop.html).
  [[module.mounts]]
    source = "vendorpartial.html"
    target = "layouts/partials/vendor-file-mount-probe.html"
