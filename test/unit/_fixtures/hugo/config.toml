# Unit-test fixture for the Hugo editable-regions integration.
#
# Imports the module exactly as a real site would — a module import of the
# repo root — with a local replacement so the tests use the working tree.
baseURL = "/"
title = "Hugo Unit Fixture"
# The globals suite asserts language identity end-to-end: the snapshot emits
# site.LanguageCode as `locale`, which the renderer's Hugo reads back via
# langs.LanguageConfig.Locale.
languageCode = "en-AU"

# The theme provides partials/shortcodes/render hooks the module-templates
# suite renders through the editor (see themes/proot).
theme = "proot"

[module]
  # Relative replacement targets resolve against themesDir
  # (test/unit/_fixtures/hugo/themes), not the project dir — hence five levels.
  replacements = "github.com/cloudcannon/editables -> ../../../../.."
  [[module.imports]]
    path = "github.com/cloudcannon/editables"
  # A vendored module import for the module-templates suite. The _vendor/
  # directory is hand-crafted (with modules.txt) so the build resolves it
  # without the go toolchain — `hugo mod vendor` is not run here.
  [[module.imports]]
    path = "example.com/cc-fixture-vendor"

[params]
  brand = "Fixture Brand"

  # Params the globals suite probes (nested map + array access).
  tags = ["one", "two"]

  [params.extra]
    region = "apac"

  [params.editable_regions]
    verbose = false

# Menus the globals suite probes via site.Menus.
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 2

[[menus.footer]]
  name = "Privacy"
  url = "/privacy/"
  weight = 1
