name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:build-fixtures && npm test

      # The Hugo integration fixture builds the renderer WASM (Go) and the
      # site itself (Hugo). Pin both to the versions the renderer targets.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: integrations/hugo/renderer/go.mod
          cache-dependency-path: integrations/hugo/renderer/go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Integration tests
        run: bash run-integration-tests.sh
