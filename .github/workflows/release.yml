name: Release

on:
  push:
    tags:
      - v*

jobs:
  test:
    uses: ./.github/workflows/test.yml

  create-github-release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    outputs:
      npm_tag: ${{ steps.npm_tag.outputs.value }}
    steps:
      - name: Get tag
        id: npm_tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # e.g.: x.y.z -> latest, x.y.z-rc.1 -> rc
          TAG=$([[ "$VERSION" == *-* ]] && echo "${VERSION#*-}" | cut -d. -f1 || echo latest)
          echo "value=$TAG" >> $GITHUB_OUTPUT
      - name: Create release
        run: |
          if [ "${{ steps.npm_tag.outputs.value }}" = "latest" ]; then
            gh release create ${{ github.ref_name }} --generate-notes --repo ${{ github.repository }}
          else
            gh release create ${{ github.ref_name }} --generate-notes --prerelease --repo ${{ github.repository }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-renderer-wasm:
    runs-on: ubuntu-latest
    needs: create-github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: integrations/hugo/renderer/go.mod
          cache-dependency-path: integrations/hugo/renderer/go.sum
      - name: Build the renderer WASM
        run: bash integrations/hugo/renderer/build.sh
      - name: Upload the renderer to the release
        run: gh release upload "${{ github.ref_name }}" integrations/hugo/hugo-module/assets/_cloudcannon/hugo_renderer.wasm.gz --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-package:
    runs-on: ubuntu-latest
    needs: [test, create-github-release, upload-renderer-wasm]
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Set version in package.json
        run: npm --no-git-tag-version version "${GITHUB_REF_NAME#v}"
      - name: Publish package on npm
        run: npm publish --tag ${{ needs.create-github-release.outputs.npm_tag }}
      - uses: actions/setup-node@v6
        with:
          registry-url: https://npm.pkg.github.com
      - name: Publish package on GitHub
        run: npm publish --tag ${{ needs.create-github-release.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
